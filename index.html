<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2557B5">
<title>Consultoria Acadêmica · Gestão</title>
<link rel="icon" href="assets/logo-mini.webp" type="image/webp">
<link rel="preload" href="assets/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css?v=3.0.0">
<script src="boot.js?v=3.0.0"></script>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="login" hidden>
  <div class="login-brand">
    <img src="assets/logo-full.webp" alt="Moisés Santos Consultoria Acadêmica" width="280" height="240">
  </div>
  <form id="loginForm" class="login-card" autocomplete="on" novalidate>
    <h1>Entrar no sistema</h1>
    <p class="muted">Use o e-mail e a senha de administrador.</p>
    <label for="lgEmail">E-mail</label>
    <input id="lgEmail" type="email" autocomplete="username" required inputmode="email">
    <label for="lgPass">Senha</label>
    <div class="pass-row">
      <input id="lgPass" type="password" autocomplete="current-password" required minlength="6">
      <button type="button" class="btn-ghost sm" id="lgShow" aria-label="Mostrar senha">Mostrar</button>
    </div>
    <p id="lgErr" class="form-err" role="alert" hidden></p>
    <button type="submit" class="btn primary block" id="lgBtn">Entrar</button>
  </form>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/painel" aria-label="Início">
        <img src="assets/logo-mono.webp" alt="" width="38" height="34">
        <span class="brand-t"><b>Consultoria</b><span>Acadêmica</span></span>
      </a>
      <button type="button" class="tsearch" id="btnSearch" aria-label="Buscar (Ctrl+K)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Buscar aluno, serviço ou lançamento…</span><kbd>Ctrl K</kbd></button>
      <div class="top-actions">
        <div class="sync" id="sync" aria-live="polite"></div>
        <button class="btn gold" id="btnLaunch"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Lançar</span></button>
        <button class="userpill" id="btnMenu" aria-label="Menu da conta" aria-haspopup="menu" aria-expanded="false"><span class="av">MS</span><span class="nm">Moisés</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegação">
      <nav class="snav" id="areas" aria-label="Áreas"></nav>
      <div class="sbox" id="sideTasks"></div>
    </aside>
    <div class="content">
      <div class="subbar"><div class="subbar-in"><nav class="subtabs" id="subtabs" aria-label="Seções"></nav></div></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <nav class="bottomnav" id="bottomnav" aria-label="Áreas"></nav>
</div>

<div id="menu" class="menu" role="menu" hidden></div>
<div id="overlay" class="overlay" hidden></div>
<div id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="splash" class="splash"><img src="assets/logo-mono.webp" alt="" width="64" height="56"><span>Carregando a base…</span></div>

<script src="vendor/supabase.js?v=2.119.1"></script>
<script src="js/core.js?v=3.0.0"></script>
<script src="js/model.js?v=3.0.0"></script>
<script src="js/charts.js?v=3.0.0"></script>
<script src="js/views.js?v=3.0.0"></script>
<script src="js/actions.js?v=3.0.0"></script>
<script src="js/main.js?v=3.0.0"></script>
</body>
</html>
